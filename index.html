<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Misión Azure - Registro de Astronautas</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: white; text-align: center; padding: 20px; }
    .card { background-color: #1e293b; border-radius: 12px; padding: 25px; max-width: 450px; margin: 0 auto; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
    h1 { color: #38bdf8; margin-bottom: 5px; }
    p { color: #94a3b8; font-size: 14px; }
    input, select, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; box-sizing: border-box; }
    button { background-color: #0284c7; color: white; font-weight: bold; cursor: pointer; border: none; margin-top: 15px; transition: 0.3s; }
    button:hover { background-color: #0369a1; }
    button:disabled { background-color: #64748b; cursor: not-allowed; }
    .badge { margin-top: 20px; padding: 15px; background: #0f172a; border-radius: 8px; border: 2px dashed #38bdf8; display: none; }
    .badge img { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid #38bdf8; margin-top: 10px; }
    .error { color: #ef4444; margin-top: 15px; display: none; }
  </style>
</head>
<body>
 
  <div class="card">
    <h1>🚀 Misión Azure</h1>
    <p>Registro Oficial de Astronautas</p>
    
    <form id="astroForm">
      <input type="text" id="nombre" placeholder="Nombre del Astronauta" required>
      <select id="rango">
        <option value="Comandante">Comandante</option>
        <option value="Especialista de Misión">Especialista de Misión</option>
        <option value="Ingeniero de Vuelo">Ingeniero de Vuelo</option>
        <option value="Ingeniera de Datos">Ingeniera de Datos</option>
      </select>
      <input type="file" id="foto" accept="image/*" required>
      <button type="submit" id="btnEnviar">🚀 Registrar en la Nube</button>
    </form>
 
    <div id="badge" class="badge">
      <h3 style="color: #4ade80; margin: 0;">¡Registro Exitoso!</h3>
      <img id="badgeImg" src="" alt="Foto Astronauta">
      <h2 id="badgeNombre" style="margin: 10px 0 5px 0;"></h2>
      <p id="badgeRango" style="color: #38bdf8; font-weight: bold; margin: 0;"></p>
      
      <button type="button" style="background-color: #475569; margin-top: 20px;" onclick="agregarNuevoAstronauta()">
        ➕ Añadir nuevo astronauta
      </button>
    </div>

    <div id="mensajeError" class="error">
      <p id="textoError"></p>
    </div>
  </div>
 
  <script>
    // =========================================================================
    // ⚙️ CONFIGURACIÓN DE AZURE
    // =========================================================================
    const STORAGE_ACCOUNT_NAME = "storageaccountastronauta";
    const CONTAINER_NAME = "contenedorastronauta";
    const SAS_TOKEN = "sp=rcw&st=2026-07-28T18:14:26Z&se=2026-07-29T02:29:26Z&spr=https&sv=2026-02-06&sr=c&sig=0h7YnR8fGbsTJ4KPWVj0zsZ2GLW3VKs1Wh%2B4AHtiADU%3D";
    
    // URL de tu Azure Function para guardar en SQL Database
    const FUNCTION_URL = "https://azurefuncionastronauta-bydzfbe7b5h9evd5.westeurope-01.azurewebsites.net/api/RegistrarAstronauta";
    // =========================================================================
 
    document.getElementById('astroForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById('btnEnviar');
      const errorDiv = document.getElementById('mensajeError');
      const errorText = document.getElementById('textoError');
      
      btn.innerText = "Subiendo a Azure Storage...";
      btn.disabled = true;
      errorDiv.style.display = 'none';
 
      const nombre = document.getElementById('nombre').value;
      const rango = document.getElementById('rango').value;
      const fileInput = document.getElementById('foto');
      const file = fileInput.files[0];
 
      if (!file) {
        mostrarError("Por favor selecciona una foto");
        btn.innerText = "🚀 Registrar en la Nube";
        btn.disabled = false;
        return;
      }
 
      try {
        // 1️⃣ SUBIR FOTO A BLOB STORAGE
        console.log("Paso 1: Subiendo foto a Blob Storage...");
        const fileName = `${Date.now()}-${file.name}`;
        const blobUrl = `https://${STORAGE_ACCOUNT_NAME}.blob.core.windows.net/${CONTAINER_NAME}/${fileName}`;
        const uploadUrl = `${blobUrl}?${SAS_TOKEN}`;
 
        const uploadResponse = await fetch(uploadUrl, {
          method: 'PUT',
          headers: {
            'x-ms-blob-type': 'BlockBlob',
            'Content-Type': file.type
          },
          body: file
        });
 
        if (!uploadResponse.ok) {
          throw new Error(`Error al subir a Blob Storage (${uploadResponse.status}). Revisa el SAS Token o CORS.`);
        }
        
        console.log("✓ Foto subida a Blob Storage");
        btn.innerText = "Guardando en Base de Datos...";

        // 2️⃣ GUARDAR EN SQL DATABASE VIA FUNCTION
        console.log("Paso 2: Guardando en SQL Database...");
        const dbResponse = await fetch(FUNCTION_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nombre: nombre,
            rango: rango,
            urlFoto: blobUrl
          })
        });
 
        if (!dbResponse.ok) {
          const errorContent = await dbResponse.text();
          throw new Error(`Error en la Base de Datos (${dbResponse.status}): ${errorContent}`);
        }
        
        const resultado = await dbResponse.json();
        console.log("✓ Datos guardados en SQL Database", resultado);

        // 3️⃣ MOSTRAR CARNET
        document.getElementById('badgeImg').src = blobUrl;
        document.getElementById('badgeNombre').innerText = nombre;
        document.getElementById('badgeRango').innerText = `Rango: ${rango}`;
        document.getElementById('badge').style.display = 'block';
        document.getElementById('astroForm').style.display = 'none';

      } catch (error) {
        console.error("Error completo:", error);
        mostrarError(error.message);
      } finally {
        btn.innerText = "🚀 Registrar en la Nube";
        btn.disabled = false;
      }
    });

    function mostrarError(mensaje) {
      const errorDiv = document.getElementById('mensajeError');
      const errorText = document.getElementById('textoError');
      errorText.innerText = "❌ " + mensaje;
      errorDiv.style.display = 'block';
    }
    function agregarNuevoAstronauta() {
      // Limpiar campos del formulario
      document.getElementById('nombre').value = '';
      document.getElementById('rango').value = 'Comandante';
      document.getElementById('foto').value = '';
      
      // Ocultar carnet y mostrar formulario
      document.getElementById('badge').style.display = 'none';
      document.getElementById('astroForm').style.display = 'block';
      document.getElementById('mensajeError').style.display = 'none';
      
      // Scroll al top
      window.scrollTo(0, 0);
    }
  </script>
</body>
</html>
